name: Weekly Nature literature monitor
on:
  workflow_dispatch:
    inputs:
      backfill:
        description: 'Historical backfill from start_date (true/false)'
        required: false
        default: 'false'
  schedule:
    - cron: '0 1 * * 1' # UTC = Monday 09:00 Singapore (UTC+8)
permissions:
  contents: write
concurrency:
  group: nature-monitor
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: pip install -r requirements.txt
      - name: Update literature database
        env:
          OPENALEX_API_KEY: ${{ secrets.OPENALEX_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          BACKFILL: ${{ inputs.backfill || 'false' }}
        run: python monitor.py
      - name: Commit updated database and reports
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/ reports/
          if ! git diff --cached --quiet; then
            git commit -m "Update literature monitor"
            git push
          fi
